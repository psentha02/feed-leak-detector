# Industry details for the generator. Every number here is a PLACEHOLDER
# assumption (see DATA.md). Nothing comes from a real retailer or brand.
name: beverage_grocery
start_date: "2026-01-05"     # a Monday
days: 90
n_stores: 30
regions: [East, West]
formats:
  Supermarket: {size: [1.2, 2.0]}   # demand multiplier range
  Convenience: {size: [0.4, 0.8]}
day_of_week: [0.85, 0.80, 0.85, 0.95, 1.15, 1.35, 1.05]   # Monday first
packs:                                # 20 products in total
  single: {count: 8, base_rate: [3.0, 5.0], price: [1.79, 2.49]}
  6pack:  {count: 7, base_rate: [2.0, 3.5], price: [7.99, 10.99]}
  case12: {count: 5, base_rate: [1.5, 2.5], price: [18.99, 24.99]}
base_promos: {count: 6, days: [7, 14], lift: [1.3, 2.0], products: [1, 3]}
inventory: {par_weeks: 1.5, par_floor: 3, reorder_fraction: 0.4}
notes: {rate: 0.01, benign: ["late scan", "price check", "damaged units written off"]}
# Realism noise (placeholders). Poisson alone was too clean; see DECISIONS.md #9.
noise:
  dispersion: 4.0         # gamma-Poisson: variance = mean + mean^2 / dispersion (lower = noisier)
  store_day_sd: 0.15      # whole-store good and bad days (log scale)
  product_drift_sd: 0.05  # weekly random walk in each product's demand (log scale)
  row_dropout: 0.003      # share of sales rows randomly missing from any file
# Notices feed (free text from the retailer). Most are harmless distractors. PLACEHOLDER texts.
notices:
  distractors: 8   # per scenario
  all_stores: ["Holiday schedule reminder: reduced hours on the next public holiday.",
               "Reminder: vendor invoices are due by the 15th.",
               "Receiving hours are changing next month."]
  one_store: ["Planogram reset scheduled for {store}.",
              "Shelf-tag refresh at {store} this week.",
              "New cooler installed at {store}."]
  one_product: ["New shelf tag printed for UPC {upc}.",
                "Case-pack label updated for UPC {upc}."]
